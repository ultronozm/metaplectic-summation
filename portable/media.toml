# The figures of the sketches, each under the sketch it illustrates.
#
# A figure is a static SVG in figures/, made and checked by figures/make_figures.py.  It is placed by the label that
# sketches.tex targets, so neither the prose of a sketch nor the numbering of the paper takes part.  Its title and
# caption are TeX, rendered with the paper's macros; a reference in them is a link into the paper.  `depends` lists
# the labels whose text the drawing follows, besides those the caption cites and the target of its sketch; audit.py
# records when the figure was last compared with them.  The inventory, with reasons, is in MEDIA.md.  The numbers of
# the paper change with it, so a unit is always named by its label, and the build refuses a statement number written
# here or in MEDIA.md.

[[figure]]
id = "double-cover"
sketch = "sec:genuine"
file = "figures/double-cover.svg"
tag = "exact"
title = '''Deligne's torsor for $n = 2$ over $\mathbb{R}$ has no section over the punctured plane'''
depends = ["sec:hilbert-symbol", "sec:genuine"]
caption = '''
For $F = \mathbb{R}$ and $n = 2$, the symbol $\{x, y\}_2$ is $-1$ exactly when $x < 0$ and $y < 0$.  Going once around the origin through the charts $U_X$, $U_Y$, $U_X$, $U_Y$, the transition relation \eqref{eq:transition-relation} contributes this sign once, over the third quadrant.  So the torsor is the connected double cover of the punctured plane, and has no section over $U$.

Concretely, write $z := x + i y$ and $\sqrt{z}$ for its principal square root.  For a smooth odd function $f$ on $\mathbb{C}^\times$, the pair $\Phi_Y(v) := f(\sqrt{z})$, $\Phi_X(v) := f(\{x, y\}_2 \sqrt{z})$ is a genuine function, and every genuine function arises in this way: the torsor is the cover $w \mapsto w^2$.  This model is not in the paper; \texttt{make\_figures.py} checks the transition relation for it numerically.  The dilations by $F^{\times 2} = \mathbb{R}_{>0}$ act on both sides, so the picture records only the directions of $v$ and $w$.
'''

[[figure]]
id = "lines"
sketch = "definition:lines"
file = "figures/lines.svg"
tag = "exact"
title = 'Which square root $R_X$ integrates over a line, for $n = 2$ over $\mathbb{R}$'
depends = ["definition:lines", "lemma:lines", "proposition:fourier-transform-genuine"]
caption = '''
For $F = \mathbb{R}$ and $n = 2$, the line $x y' - y x' = \tau^2$ with $\tau \neq 0$ misses the origin, and its preimage under $w \mapsto w^2$ is a hyperbola whose two branches are exchanged by $w \mapsto -w$.  In the model of the figure under \S\ref{sec:genuine}, the integrand of $R_X \Phi(v', \tau)$ in Definition \ref{definition:lines} is $f(\sigma(z))$, where $\sigma(z) := \{x, b y\}_2 \sqrt{z}$ and $(a, b) := (y', -x')$.  The factor $\{x, -x'\}_2$ makes $\sigma$ continuous along the line: it is the branch through the principal square root of the point where the line meets the $y$-axis.

As the line turns once about the origin, the hyperbola turns by half a turn, so its branches are exchanged, and no choice of branch depends continuously on the line.  The choice made by $R_X$ jumps where the line becomes $x = -\tau^2$, that is, where $x' = 0$, outside $U_X$.  Accordingly, $R_X \Phi$ and $R_Y \Phi$ differ by $\{x', y'\}_n$ (Lemma \ref{lemma:lines}), and $\mathcal{F} \Phi$ is again genuine (Proposition \ref{proposition:fourier-transform-genuine}).
'''
