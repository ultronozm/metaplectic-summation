# The figures of the sketches, each under the sketch it illustrates.
#
# A figure is a static SVG in figures/, made and checked by figures/make_figures.py.  It is placed by the label that
# sketches.tex targets, so neither the prose of a sketch nor the numbering of the paper takes part.  Its title and
# caption are TeX, rendered with the paper's macros; a reference in them is a link into the paper.  `depends` lists
# the labels whose text the drawing follows, besides those the caption cites and the target of its sketch; audit.py
# records when the figure was last compared with them.  The inventory, with reasons, is in MEDIA.md.  The numbers of
# the paper change with it, so a unit is always named by its label, and the build refuses a statement number written
# here or in MEDIA.md.

[[figure]]
id = "charts"
sketch = "sec:genuine"
file = "figures/charts.svg"
tag = "exact"
title = '''Deligne's torsor for $n = 2$ over $\mathbb{R}$, in the charts $U_X$ and $U_Y$: no section over the punctured plane'''
depends = ["sec:hilbert-symbol", "sec:genuine"]
caption = '''
For $F = \mathbb{R}$ and $n = 2$, the symbol $\{x, y\}_2$ is $-1$ exactly when $x < 0$ and $y < 0$.  Over each chart the torsor is trivial, so the two points above $v$ carry the labels $\zeta = \pm 1$ there, and a genuine function takes the value $\zeta \Phi_X(v)$, resp. $\zeta \Phi_Y(v)$, at them.  By the transition relation \eqref{eq:transition-relation}, the point labelled $\zeta$ in $U_X$ is labelled $\{x, y\}_2 \zeta$ in $U_Y$.

Follow a point once around the origin, through the arcs of $U_X$, $U_Y$, $U_X$, $U_Y$, changing chart in each quadrant.  The label is multiplied by $\{x, y\}_2$ at each change, that is, by $-1$ once, in the third quadrant.  So the point returns with the other label: the monodromy is $-1$, and the torsor has no section over $U$.  (Over $\mathbb{R}$ this means, as it happens, that the torsor is the connected double cover of $\mathbb{R}^2 - \{0\}$, the squaring map of $\mathbb{C}^\times$; the paper does not use this.)
'''

[[figure]]
id = "lines"
sketch = "definition:lines"
file = "figures/lines.svg"
tag = "exact"
title = 'Which point of the torsor the integrand of $R_X$ reads along a line, for $n = 2$ over $\mathbb{R}$'
depends = ["definition:lines", "lemma:lines", "proposition:fourier-transform-genuine"]
caption = '''
For $F = \mathbb{R}$, $n = 2$ and $\tau \neq 0$, the line $x y' - y x' = \tau^2$ misses the origin.  Write $(a, b) := (y', -x')$, with $b \neq 0$.  In Definition \ref{definition:lines}, the integrand of $R_X \Phi(v', \tau)$ is $\{x, -x'\}_2 \Phi_X(v)$, and by the transition relation it equals $\{x, b y\}_2 \Phi_Y(v)$ where $y \neq 0$.  In the terms of the figure under \S\ref{sec:genuine}, it reads at each point of the line the point of the torsor labelled $\{x, -x'\}_2$ in $U_X$ and $\{x, b y\}_2$ in $U_Y$.  Each label changes only where its own chart ends, and there the other label is constant, so the integrand is continuous along the line.

Take $(a, b) = (\cos \alpha, \sin \alpha)$ and $\tau = 1$, so that the line touches the unit circle at $(\cos \alpha, \sin \alpha)$.  At that point the label read is $+1$ in $U_Y$ on both open half circles, but in $U_X$ it is $+1$ for $\alpha$ just below $\pi$ and $-1$ just above.  So the point read jumps once as the line turns, where $x' = 0$, outside $U_X$, as the monodromy $-1$ requires.  Accordingly, $R_X \Phi$ and $R_Y \Phi$ differ by $\{x', y'\}_n$ (Lemma \ref{lemma:lines}), and $\mathcal{F} \Phi$ is again genuine (Proposition \ref{proposition:fourier-transform-genuine}).
'''
