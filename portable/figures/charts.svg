<text x="18" y="440" font-size="12" text-anchor="start" fill="#25332b" font-weight="normal">On each arc, the outer track is the label ζ = +1 and the inner track ζ = −1, in the chart in use.</text>
<text x="18" y="458" font-size="12" text-anchor="start" fill="#25332b" font-weight="normal">Passing to the next chart multiplies the label by {x, y}₂: the tracks continue where it is +1 and cross</text>
<text x="18" y="476" font-size="12" text-anchor="start" fill="#25332b" font-weight="normal">where it is −1, in the third quadrant.  Once around, a point returns with the other label: monodromy −1.</text>
