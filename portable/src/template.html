<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}} — sketches</title>
<script>document.documentElement.className = 'js';</script>
<style>
{{CSS}}
</style>
</head>
<body>
<a class="skip" href="#reading">Skip to the sketches</a>
<header id="bar">
  <button id="btn-contents" type="button" aria-expanded="false" aria-controls="contents">Contents</button>
  <div id="where" aria-live="off"></div>
  <span class="grow"></span>
  <button id="btn-paper" type="button" aria-pressed="false" aria-controls="paper" title="Show the paper's text next to this sketch (Esc closes it)">Paper</button>
  <button id="btn-about" type="button">About</button>
</header>
<div id="status" role="status" aria-live="polite"></div>
<noscript><div class="notice">This page needs JavaScript to typeset formulas and to move between the sketches and the paper.  Without it, the sketches are listed first, then the paper, and formulas appear as TeX source.</div></noscript>
<nav id="contents" aria-label="Contents" hidden>
{{CONTENTS}}
<p class="toc-note"><span class="toc-bare"></span> marks a unit without a sketch.</p>
</nav>
<div id="layout">
<main id="reading" aria-label="Sketches">
<div class="doc-head">
<h1>{{HEADLINE}}</h1>
<p>Informal sketches, in the order of the paper.  Each links to the precise text; the paper opens beside the sketch, or over it in a narrow window.  Esc or Back returns you to your place.</p>
</div>
{{COLUMN}}
</main>
<aside id="paper" aria-label="The paper">
<div class="paper-bar">
  <button id="btn-back" type="button" title="Back to the previous place" disabled>&larr; Back</button>
  <div class="loc" id="paper-loc" aria-live="off"></div>
  <button id="btn-sketch" type="button" class="primary" disabled>Sketch</button>
  <select id="paper-jump" aria-label="Go to a section of the paper">
{{JUMP}}
  </select>
  <label class="fold"><input type="checkbox" id="fold-proofs"> fold proofs</label>
  <button id="btn-close" type="button" aria-label="Close the paper" title="Close (Esc)">&#10005;</button>
</div>
<div class="paper-scroll" id="paper-scroll" tabindex="-1">
<article class="paper-text" id="paper-text">
{{PANE}}
</article>
</div>
</aside>
</div>
<div id="about" hidden role="dialog" aria-modal="true" aria-label="About this edition">
<div class="sheet">
{{ABOUT}}
</div>
</div>
<script type="application/json" id="edition-data">{{DATA}}</script>
<script>window.EDITION = JSON.parse(document.getElementById('edition-data').textContent);</script>
<script>
{{KATEX_JS}}
</script>
<script>
{{READER_JS}}
</script>
</body>
</html>
