# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
# formalization.yaml v0.4, following the Palomar starter template.
# Before submitting: add the root LICENSE file, fill in the automation models
# and costs if known, and update review.status after the statements are audited.
version: "v0.4"

project:
  name: "A Schwartz space for the n-fold cover of SL2"
  description: >-
    Lean formalization, over number fields, of the main results of the paper
    "A Schwartz space for the n-fold cover of SL2": the Fourier transform on
    the Schwartz space of genuine functions on Deligne's torsor (inversion,
    equivariance under the local metaplectic cover, Plancherel), the adelic
    Poisson summation formula with a unique boundary functional, and the
    resulting Voronoi-type summation formulas for twisted sums of Gauss sums of
    order n, including the specialization taking sextic twists of cubic Gauss
    sums to quadratic twists.
  authors:
    - "Paul D. Nelson"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Paul D. Nelson"

classification:
  arxiv: ["math.NT"]
  msc2020: ["11F70", "11F27", "11L05", "22E50"]

sources:
  - title: "A Schwartz space for the n-fold cover of SL2"
    authors:
      - "Paul D. Nelson"
    type: "paper (preprint)"
    location: "schwartz-space-n-fold-cover-sl2.tex in this repository"
    relationship: "formalizes"
    note: >-
      The formalization follows the paper's definitions and proofs, restricted
      to number fields (the paper treats global fields containing the n-th roots
      of unity).
    author_endorsement: "participated"

related_formalizations:
  - id: "https://github.com/PalomarArchive/n-yamaguchi-0729--FiniteAbelianGlobalReciprocityv2--ccc6f4bb14f4"
    relationship: "builds-on"
    note: >-
      Pinned Lake dependency (revision 58370e628052f54159c1eac913de908e360059d6).
      Its coherent Hilbert pairing supplies the existence of the normalized
      family of Hilbert symbols.
  - id: "OpenAI quasi-Riemann-hypothesis Lean development (GroundTheory)"
    relationship: "adapts"
    note: >-
      lean/vendor/ground-theory vendors 35 modules, including adelic Poisson
      summation, with a two-line compatibility patch; see
      lean/vendor/ground-theory/README.md and lean/licenses/OpenAI-Lean-Apache-2.0.txt.
  - id: "Tau Ceti"
    relationship: "adapts"
    note: >-
      Derivative estimates for products of Schwartz functions adapted in
      lean/MetaplecticSummation/SchwartzTensor.lean; see
      lean/licenses/TauCeti-Apache-2.0.txt.

status:
  scope: >-
    Formalized for number fields F containing a primitive n-th root of unity;
    the paper also covers global function fields of characteristic prime to n.
    Challenge.lean states Theorem 10.33 (twisted sums of Gauss sums of order n)
    and Corollary 10.39 (the quadratic dual) against Mathlib alone. The
    self-dual measures and the local Hilbert symbols are quantified over: any
    measures and any family satisfying the axioms IsHilbertFamily (which
    determine them), with existence proved in exists_selfDual_hilbert. The
    local transform W^∨ is the explicit integral of Proposition 10.8 at
    lambda = 1 (formula (10.15)). In Theorem 10.33 the main-term constants are
    asserted to exist independently of the twist and the weights, rather than
    identified with the constants of Theorem 10.16. The Schwartz space,
    Theorem 7.1, the Poisson formula (Theorem 9.1, Corollary 9.2) and
    Theorem 10.16 are proved in the development but not restated in
    Challenge.lean.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

automation:
  methods:
    - method: "agent"
      models:
        - "Codex (OpenAI coding agent; model versions not recorded)"
        - "Claude (Anthropic coding agent; model versions not recorded)"
      framework: "Codex and Claude Code"
      tool_setup: >-
        AI coding agents wrote the Lean development under the direction of the
        paper's author, who chose the statements to formalize and the order of
        work; the agents built and checked the project with Lake.
      cost:
        wall_time: "git history spans 2026-11-22 to 2026-11-25"
        spend_usd: "not tracked"
        hardware: "local machine"
      prompting_notes: "not recorded"
    - method: "agent"
      models: ["claude-opus-5-5"]
      framework: "Claude Code"
      tool_setup: >-
        Wrote Challenge.lean and the bridge in Solution.lean (generated by
        scripts/make-solution.py from scripts/solution-proofs.lean-fragment)
        and assembled this repository.
      cost:
        wall_time: "one session"
        spend_usd: "not tracked"
        hardware: "local machine"
      prompting_notes: "n/a"
  spend_usd: "not tracked"
  notes: >-
    The formalization was written by AI agents under the direction of Paul D.
    Nelson. The paper's acknowledgments record extensive use of the coding
    agents Codex and Claude.

fidelity:
  divergences: >-
    Number fields only. The self-dual measures and the Hilbert symbols are
    characterized by their properties rather than constructed in
    Challenge.lean. The quadratic residue symbol in Corollary 10.39 is formed
    from any family of quadratic Hilbert symbols and any injective embedding of
    mu_2 (both unique). Test weights are compactly supported on F_v^x and
    smooth in real coordinates (archimedean v) or locally constant (finite v).

review:
  status: "pending author review"
  reviewers:
    - "none"
  notes: >-
    Comparator (Lean kernel, NanoDa and con-ron) accepts Solution.lean against
    Challenge.lean locally; all compared theorems depend only on propext,
    Classical.choice and Quot.sound. The statements in Challenge.lean were
    written by an AI agent and have not yet been audited by a human.

alignment:
  namespace: "NFoldCover"
  statements:
    - source: "Theorem 10.33"
      lean: "NFoldCover.twistedGaussSummation"
      module: "Challenge"
      status: "proved"
      note: "Main-term constants asserted to exist; absolute convergence included."
    - source: "Corollary 10.39"
      lean: "NFoldCover.quadraticDual"
      module: "Challenge"
      status: "proved"
      note: "n odd, odd residue characteristic outside S."
    - source: "Existence of self-dual measures and Hilbert symbols (Sections 2 and 9.1)"
      lean: "NFoldCover.exists_selfDual_hilbert"
      module: "Challenge"
      status: "proved"
      note: "Shows that the hypotheses of the two theorems can be met."

acknowledgements: >-
  Mathlib; N. Yamaguchi's FiniteAbelianGlobalReciprocityv2; the GroundTheory
  modules of OpenAI's quasi-Riemann-hypothesis Lean development; Tau Ceti.
